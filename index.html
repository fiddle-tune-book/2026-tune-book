<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2026 Tune Book</title>
<style>
  :root {
    --bg: #f7f3ec;
    --card: #ffffff;
    --ink: #2b2620;
    --ink-soft: #6b6255;
    --accent: #8a4b2e;
    --accent-soft: #f0e2d3;
    --border: #e3d9c8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }
  .wrap {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }
  h1 {
    font-size: 2.1rem;
    margin: 0 0 0.3rem;
    letter-spacing: 0.01em;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 1.05rem;
    margin: 0 0 0.6rem;
    font-style: italic;
  }
  .version {
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-family: 'Courier New', monospace;
    margin: 0 0 2.2rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.75rem;
    box-shadow: 0 2px 10px rgba(43, 38, 32, 0.06);
  }
  .files {
    display: grid;
    gap: 0.9rem;
  }
  .file-link {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    text-decoration: none;
    color: var(--ink);
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    transition: background 0.15s ease, transform 0.1s ease;
    text-align: left;
  }
  .file-link:hover {
    background: #e8d6c1;
    transform: translateY(-1px);
  }
  .icon {
    font-size: 1.6rem;
    line-height: 1;
    flex-shrink: 0;
  }
  .file-name {
    font-weight: bold;
    font-size: 1.05rem;
  }
  .file-meta {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }
  .qr-link {
    display: inline-block;
    margin-top: 1.75rem;
  }
  .qr-link img {
    width: 110px;
    height: 110px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    padding: 6px;
    transition: transform 0.1s ease;
  }
  .qr-link:hover img {
    transform: scale(1.04);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>2026 Tune Book</h1>
    <p class="subtitle">Sheet music &amp; engravings</p>
    <p class="version">Version 0.9.1 · 2026-08-26</p>
    <div class="card">
      <div class="files">
        <a class="file-link" href="https://github.com/fiddle-tune-book/2026-tune-book/releases/latest/download/2026_Tune_Book.pdf">
          <span class="icon">📄</span>
          <span>
            <div class="file-name">2026_Tune_Book.pdf</div>
            <div class="file-meta">PDF · 4.9 MB</div>
          </span>
        </a>
        <a class="file-link" href="https://github.com/fiddle-tune-book/2026-tune-book/releases/latest/download/2026_tune_book_engravings.zip">
          <span class="icon">🗂️</span>
          <span>
            <div class="file-name">2026_tune_book_engravings.zip</div>
            <div class="file-meta">ZIP · 4.4 MB · per-tune engravings</div>
          </span>
        </a>
      </div>
    </div>
    <a class="qr-link" href="qr.png">
      <img src="qr.png" alt="QR code linking to this page">
    </a>
  </div>
</body>
</html>
